backend:
  name: github
  repo: MDani0/macsaipottery
  branch: master

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pottery"
    label: "Pottery Items"
    folder: "src/pottery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title (English)", name: "title", widget: "string"}
      - {label: "Title (Hungarian)", name: "title_hu", widget: "string", required: false}
      - {label: "Images", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
      - {label: "Price (HUF)", name: "price", widget: "number"}
      - {label: "Price (EUR)", name: "price_eur", widget: "number", required: false, hint: "Optional Euro price for international buyers"}
      - {label: "Status", name: "status", widget: "select", options: ["available", "sold"]}
      - {label: "Category", name: "category", widget: "select", options: ["Bowl", "Vase", "Mug", "Plate", "Sculpture", "Bonsai Pot", "Other"]}
      - {label: "Height (cm)", name: "height", widget: "number", required: false, value_type: "float"}
      - {label: "Diameter (cm)", name: "diameter", widget: "number", required: false, value_type: "float"}
      - {label: "Width (cm)", name: "width", widget: "number", required: false, value_type: "float"}
      - {label: "Materials (English)", name: "materials", widget: "string", required: false}
      - {label: "Materials (Hungarian)", name: "materials_hu", widget: "string", required: false}
      - {label: "Technique (English)", name: "technique", widget: "string", required: false}
      - {label: "Technique (Hungarian)", name: "technique_hu", widget: "string", required: false}
      - {label: "Description (English)", name: "description", widget: "text"}
      - {label: "Description (Hungarian)", name: "description_hu", widget: "text", required: false}
      - {label: "Year Created", name: "year", widget: "number", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false}

  - name: "pages"
    label: "Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "src/about.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "page.njk"}
          - {label: "Artist Name", name: "artist_name", widget: "string"}
          - {label: "Artist Photo", name: "artist_photo", widget: "image"}
          - {label: "Bio", name: "body", widget: "markdown"}
          - {label: "Studio Location", name: "location", widget: "string", required: false}

      - label: "Home Page"
        name: "home"
        file: "src/index.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "home.njk"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text"}
          - {label: "Intro Text", name: "body", widget: "markdown"}

      - label: "Contact Page"
        name: "contact"
        file: "src/_data/contact.json"
        fields:
          - {label: "Email Address", name: "email", widget: "string"}
          - {label: "Response Time (hours)", name: "response_time_hours", widget: "string", hint: "e.g., 24-48"}
          - {label: "Show Studio Visits Section", name: "studio_visits_available", widget: "boolean", default: true}

  - name: "translations"
    label: "UI Translations"
    files:
      - label: "Translations"
        name: "translations"
        file: "src/_data/translations.json"
        fields:
          - label: "English Translations"
            name: "en"
            widget: "object"
            fields:
              - label: "Navigation"
                name: "nav"
                widget: "object"
                fields:
                  - {label: "Home", name: "home", widget: "string"}
                  - {label: "Available", name: "available", widget: "string"}
                  - {label: "Past Work", name: "pastWork", widget: "string"}
                  - {label: "About", name: "about", widget: "string"}
                  - {label: "Contact", name: "contact", widget: "string"}
              - label: "Gallery Filters"
                name: "gallery"
                widget: "object"
                fields:
                  - {label: "All", name: "filterAll", widget: "string"}
                  - {label: "Bowls", name: "filterBowls", widget: "string"}
                  - {label: "Vases", name: "filterVases", widget: "string"}
                  - {label: "Mugs", name: "filterMugs", widget: "string"}
                  - {label: "Plates", name: "filterPlates", widget: "string"}
                  - {label: "Sculptures", name: "filterSculptures", widget: "string"}
                  - {label: "Bonsai Pots", name: "filterBonsaiPots", widget: "string"}
                  - {label: "Other", name: "filterOther", widget: "string"}
              - label: "Footer"
                name: "footer"
                widget: "object"
                fields:
                  - {label: "Rights", name: "rights", widget: "string"}
                  - {label: "Contact", name: "contact", widget: "string"}
                  - {label: "About", name: "about", widget: "string"}
                  - {label: "Instagram", name: "instagram", widget: "string"}
              - label: "Home Page"
                name: "home"
