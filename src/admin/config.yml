backend:
  name: github
  repo: MDani0/macsaipottery
  branch: master

publish_mode: editorial_workflow

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  # Pottery Items - unchanged, works well
  - name: "pottery"
    label: "Pottery Items"
    folder: "src/pottery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title (English)", name: "title", widget: "string"}
      - {label: "Title (Hungarian)", name: "title_hu", widget: "string", required: false}
      - {label: "Images", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
      - {label: "Price (HUF)", name: "price", widget: "number"}
      - {label: "Price (EUR)", name: "price_eur", widget: "number", required: false, hint: "Optional Euro price for international buyers"}
      - {label: "Status", name: "status", widget: "select", options: ["available", "sold"]}
      - {label: "Category", name: "category", widget: "select", options: ["Bowl", "Vase", "Mug", "Plate", "Sculpture", "Bonsai Pot", "Other"]}
      - {label: "Height (cm)", name: "height", widget: "number", required: false, value_type: "float"}
      - {label: "Diameter (cm)", name: "diameter", widget: "number", required: false, value_type: "float"}
      - {label: "Width (cm)", name: "width", widget: "number", required: false, value_type: "float"}
      - {label: "Materials (English)", name: "materials", widget: "string", required: false}
      - {label: "Materials (Hungarian)", name: "materials_hu", widget: "string", required: false}
      - {label: "Technique (English)", name: "technique", widget: "string", required: false}
      - {label: "Technique (Hungarian)", name: "technique_hu", widget: "string", required: false}
      - {label: "Description (English)", name: "description", widget: "text"}
      - {label: "Description (Hungarian)", name: "description_hu", widget: "text", required: false}
      - {label: "Year Created", name: "year", widget: "number", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false}

  # Pages - content + translations in one place
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "src/_data/pages/home.json"
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - label: "Hero Title"
            name: "heroTitle"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Hero Subtitle"
            name: "heroSubtitle"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Intro Text"
            name: "intro"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "markdown"}
              - {label: "Hungarian", name: "hu", widget: "markdown"}
          - label: "Featured Section Title"
            name: "featuredTitle"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "View All Button"
            name: "viewAll"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}

      - label: "About Page"
        name: "about"
        file: "src/_data/pages/about.json"
        fields:
          - {label: "Artist Photo", name: "artistPhoto", widget: "image"}
          - label: "Artist Name"
            name: "artistName"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Studio Location"
            name: "location"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Page Title"
            name: "title"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Artist Section"
            name: "artist"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Text"
                name: "text"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "text"}
                  - {label: "Hungarian", name: "hu", widget: "text"}
          - label: "Process Section"
            name: "process"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Text"
                name: "text"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "text"}
                  - {label: "Hungarian", name: "hu", widget: "text"}
          - label: "Techniques Section"
            name: "techniques"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Text"
                name: "text"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "text"}
                  - {label: "Hungarian", name: "hu", widget: "text"}
          - label: "Studio Section"
            name: "studio"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Text (with HTML for links)"
                name: "text"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "text"}
                  - {label: "Hungarian", name: "hu", widget: "text"}

      - label: "Contact Page"
        name: "contact"
        file: "src/_data/pages/contact.json"
        fields:
          - {label: "Email Address", name: "email", widget: "string"}
          - label: "Page Title"
            name: "title"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Page Subtitle"
            name: "subtitle"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Form Labels"
            name: "form"
            widget: "object"
            fields:
              - label: "Name"
                name: "name"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Email"
                name: "email"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Phone"
                name: "phone"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Item"
                name: "item"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Message"
                name: "message"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Required"
                name: "required"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Submit Button"
                name: "submit"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Other Ways Section"
            name: "otherWays"
            widget: "object"
            fields:
              - label: "Section Title"
                name: "title"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Email Label"
                name: "emailLabel"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Response Time"
                name: "responseTime"
                widget: "object"
                fields:
                  - label: "Label"
                    name: "label"
                    widget: "object"
                    fields:
                      - {label: "English", name: "en", widget: "string"}
                      - {label: "Hungarian", name: "hu", widget: "string"}
                  - label: "Text"
                    name: "text"
                    widget: "object"
                    fields:
                      - {label: "English", name: "en", widget: "text"}
                      - {label: "Hungarian", name: "hu", widget: "text"}
              - label: "Studio Visits"
                name: "studioVisits"
                widget: "object"
                fields:
                  - label: "Label"
                    name: "label"
                    widget: "object"
                    fields:
                      - {label: "English", name: "en", widget: "string"}
                      - {label: "Hungarian", name: "hu", widget: "string"}
                  - label: "Text"
                    name: "text"
                    widget: "object"
                    fields:
                      - {label: "English", name: "en", widget: "text"}
                      - {label: "Hungarian", name: "hu", widget: "text"}

      - label: "Available Page"
        name: "available"
        file: "src/_data/pages/available.json"
        fields:
          - label: "Title"
            name: "title"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Subtitle"
            name: "subtitle"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}

      - label: "Past Work Page"
        name: "pastWork"
        file: "src/_data/pages/pastWork.json"
        fields:
          - label: "Title"
            name: "title"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Subtitle"
            name: "subtitle"
            widget: "object"
            fields:
              - {label: "English", name: "en", widget: "string"}
              - {label: "Hungarian", name: "hu", widget: "string"}

  # Site-Wide - navigation, filters, labels
  - name: "sitewide"
    label: "Site-Wide"
    files:
      - label: "Navigation & Footer"
        name: "navigation"
        file: "src/_data/sitewide/navigation.json"
        fields:
          - label: "Navigation Links"
            name: "nav"
            widget: "object"
            fields:
              - label: "Home"
                name: "home"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Available"
                name: "available"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Past Work"
                name: "pastWork"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "About"
                name: "about"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Contact"
                name: "contact"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - label: "Rights"
                name: "rights"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Contact"
                name: "contact"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "About"
                name: "about"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Instagram"
                name: "instagram"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}

      - label: "Gallery & Filters"
        name: "gallery"
        file: "src/_data/sitewide/gallery.json"
        fields:
          - label: "Filter Labels"
            name: "filters"
            widget: "object"
            fields:
              - label: "All"
                name: "all"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Bowls"
                name: "bowls"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Vases"
                name: "vases"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Mugs"
                name: "mugs"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Plates"
                name: "plates"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Sculptures"
                name: "sculptures"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Bonsai Pots"
                name: "bonsaiPots"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Other"
                name: "other"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
          - label: "Empty State Messages"
            name: "emptyStates"
            widget: "object"
            fields:
              - label: "Available Page"
                name: "available"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "text"}
                  - {label: "Hungarian", name: "hu", widget: "text"}
              - label: "Past Work Page"
                name: "pastWork"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "text"}
                  - {label: "Hungarian", name: "hu", widget: "text"}

      - label: "Pottery Item Labels"
        name: "pottery"
        file: "src/_data/sitewide/pottery.json"
        fields:
          - label: "Status Badges"
            name: "badges"
            widget: "object"
            fields:
              - label: "Available"
                name: "available"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Sold"
                name: "sold"
                widget: "object"
                fields:
