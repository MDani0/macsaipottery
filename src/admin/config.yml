                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Artist Title", name: "artistTitle", widget: "string"}
                  - {label: "Artist Text", name: "artistText", widget: "text"}
                  - {label: "Process Title", name: "processTitle", widget: "string"}
                  - {label: "Process Text", name: "processText", widget: "text"}
                  - {label: "Techniques Title", name: "techniquesTitle", widget: "string"}
                  - {label: "Techniques Text", name: "techniquesText", widget: "text"}
                  - {label: "Studio Title", name: "studioTitle", widget: "string"}
