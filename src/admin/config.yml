                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Featured Title", name: "featuredTitle", widget: "string"}
                  - {label: "View Details", name: "viewDetails", widget: "string"}
                  - {label: "View All", name: "viewAll", widget: "string"}
              - label: "About Page"
                name: "about"
