                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Width"
                name: "width"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Diameter"
                name: "diameter"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Materials"
                name: "materials"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Technique"
                name: "technique"
                widget: "object"
                fields:
                  - {label: "English", name: "en", widget: "string"}
                  - {label: "Hungarian", name: "hu", widget: "string"}
              - label: "Year"
                name: "year"
                widget: "object"
