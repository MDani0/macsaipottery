backend:
  name: git-gateway
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pottery"
    label: "Pottery Items"
    folder: "src/pottery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Images", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}}
      - {label: "Price", name: "price", widget: "number"}
      - {label: "Status", name: "status", widget: "select", options: ["available", "sold"]}
      - {label: "Category", name: "category", widget: "select", options: ["Bowl", "Vase", "Mug", "Plate", "Sculpture", "Bonsai Pot", "Other"]}
      - {label: "Height (inches)", name: "height", widget: "number", required: false}
      - {label: "Diameter (inches)", name: "diameter", widget: "number", required: false}
      - {label: "Width (inches)", name: "width", widget: "number", required: false}
      - {label: "Materials", name: "materials", widget: "string", required: false}
      - {label: "Technique", name: "technique", widget: "string", required: false}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Year Created", name: "year", widget: "number", required: false}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false}

  - name: "pages"
    label: "Pages"
    files:
      - label: "About Page"
        name: "about"
        file: "src/about.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "page.njk"}
          - {label: "Artist Name", name: "artist_name", widget: "string"}
          - {label: "Artist Photo", name: "artist_photo", widget: "image"}
          - {label: "Bio", name: "body", widget: "markdown"}
          - {label: "Studio Location", name: "location", widget: "string", required: false}

      - label: "Home Page"
        name: "home"
        file: "src/index.md"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Layout", name: "layout", widget: "hidden", default: "home.njk"}
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Hero Title", name: "hero_title", widget: "string"}
          - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text"}
          - {label: "Intro Text", name: "body", widget: "markdown"}
